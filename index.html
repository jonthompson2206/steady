<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steady - Smart Volume Management for Runners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="nav">
        <div class="nav-content">
            <a href="#/" class="nav-logo">
                <img src="static/steady-logo.png" alt="Steady" class="nav-logo-img">
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
            </button>
            <div class="nav-links" id="navLinks" style="display:none;">
                <a href="#/dashboard" class="nav-link">Dashboard</a>
                <a href="#/plan" class="nav-link">Plan</a>
                <a href="#/" class="nav-link" onclick="App.sync(); return false;">Sync</a>
                <a href="#/settings" class="nav-link">Settings</a>
                <a href="#/" class="nav-link nav-link--muted" onclick="App.logoutAndClear(); return false;">Logout</a>
            </div>
        </div>
    </nav>

    <script>
    (function() {
        const toggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        if (toggle && navLinks) {
            toggle.addEventListener('click', function() {
                const isOpen = navLinks.classList.toggle('nav-links--open');
                toggle.classList.toggle('nav-toggle--open', isOpen);
                toggle.setAttribute('aria-expanded', isOpen);
            });
            navLinks.querySelectorAll('.nav-link').forEach(function(link) {
                link.addEventListener('click', function() {
                    navLinks.classList.remove('nav-links--open');
                    toggle.classList.remove('nav-toggle--open');
                    toggle.setAttribute('aria-expanded', 'false');
                });
            });
        }
    })();
    </script>

    <main class="main" id="mainContent">
        <div class="loading-state"><p>Loading...</p></div>
    </main>

    <footer class="footer">
        <p>Train smart. Stay healthy. Run forever.</p>
    </footer>

    <script src="js/store.js"></script>
    <script src="js/calculations.js"></script>
    <script src="js/strava.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
