databases:
  - name: runsafe-db
    plan: free
    databaseName: runsafe

services:
  - type: web
    name: runsafe
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: runsafe-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        sync: false
